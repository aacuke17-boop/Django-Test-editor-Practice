{% extends "base.html" %}

{% block title %}{% if material %}Edit material{% else %}New material{% endif %} - Questionnaires{% endblock %}

{% block content %}
    <h1>{% if material %}Edit material{% else %}New material{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'my_materials' %}">Cancel</a>
    </form>
{% endblock %}
